# Live + historical perf dashboards.  Start:  docker compose -f monitoring/docker-compose.yml up -d
# Then run tests with:  python -m perfagent run <project> --type load --influx
# Grafana: http://localhost:3000 (anonymous admin, local use only)
services:
  influxdb:
    image: influxdb:1.8
    container_name: perf-influxdb
    ports: ["8086:8086"]
    environment:
      - INFLUXDB_DB=k6
      - INFLUXDB_HTTP_MAX_BODY_SIZE=0
    volumes: ["influx-data:/var/lib/influxdb"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: perf-grafana
    ports: ["3000:3000"]
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/k6-perfagent.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on: [influxdb]
    restart: unless-stopped

volumes:
  influx-data:
