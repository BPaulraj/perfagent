# Prepares the environment for the GitHub Copilot cloud agent (it runs this job before starting work).
# The job name MUST be `copilot-setup-steps`.
# Note: the cloud agent's firewall blocks most outbound hosts by default - allow-list your test targets
# (Settings > Copilot > Cloud agent) only if you want the agent to run smoke tests against them.
name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install perfagent dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Verify toolchain
        run: |
          k6 version
          python -m perfagent agents check
