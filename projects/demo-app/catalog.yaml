- id: SC-003
  name: Place a BUY trade
  type: api
  description: Customer checks wallet, finds a stock, buys 1 share, reviews trade history and dashboard
  rationale: Core revenue transaction; interactive DB transaction with 5-6 writes plus 2 inbox inserts holding the
    single connection - highest contention risk
  business_criticality: 5
  frequency: 3
  technical_risk: 5
  workload_share: 15
  data_file: users.csv
  data_requirements:
  - perf users with funded wallets (seed step adds funds)
  risks:
  - 400 Insufficient balance if wallets are not topped up for long runs
  status: approved
  steps:
  - name: Login
    method: POST
    path: /auth/login
    body:
      email: '{{email}}'
      password: '{{env.PERF_PASSWORD}}'
    expect:
    - 200
    think_time: 2
  - name: Wallet balance
    method: GET
    path: /wallet
    expect:
    - 200
    think_time: 2
  - name: Find stock
    method: GET
    path: /companies
    query:
      search: '{{search_term}}'
    extract:
      companyId: 0.id
    expect:
    - 200
    think_time: 5
  - name: Buy 1 share
    method: POST
    path: /trades
    body:
      companyId: '{{companyId}}'
      type: BUY
      quantity: 1
    expect:
    - 201
    think_time: 3
  - name: Trade history
    method: GET
    path: /trades
    expect:
    - 200
    think_time: 3
  - name: Dashboard after trade
    method: GET
    path: /dashboard/summary
    expect:
    - 200
    think_time: 2
  priority_score: 86
  priority: P1
  rank: 3
  review:
    decision: approved
    at: '2026-10-24T09:48:19+05:30'
    note: Approved by owner (own demo app); SC-009 share set to 1%, SC-002 to 29%
