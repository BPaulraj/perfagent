project: demo-app
assumptions:
- 'No published spec for the running web backend: API model reverse-engineered from packages/server source (model/server-openapi.yaml)'
- API load goes straight to the backend (localhost:4000) - the Vite dev proxy (5173) is not a production component;
  the browser scenario uses 5173
- 'No production analytics (demo app): traffic mix estimated from retail-broker norms - read-heavy, ~15% trading'
- 'UI background polling included: market prices every 15s on /trade, inbox unread count every 30s on every page'
- Each iteration = one user session; users log in per iteration (cookie session, k6 keeps a cookie jar per VU)
- k6 runs on the same machine as the app - load generator competes for CPU, so absolute numbers are indicative;
  compare runs relatively
key_risks:
- 'SQLite with DATABASE_URL connection_limit=1: every query from every user is serialised through ONE connection
  - expected first bottleneck'
- bcrypt (cost 10) on login/register runs on the Node event loop CPU - blocks all other requests while hashing
- Trade = interactive DB transaction (5-6 writes) + 2 inbox inserts, holding the single connection for its whole
  duration
- Add-funds holds each request ~1.5s (simulated payment delay) - concurrent open requests pile up
- Unpaginated lists (trades, transactions, inbox, invoices) grow with every trade - response time drifts over a
  soak
excluded:
- 'PUT /auth/profile: rare, simple single-row update (kept as SC-009 proposal, recommend defer)'
- 'GET /health: infrastructure only'
- 'packages/api Bearer REST API (port 4100): not running; test separately if it serves real clients'
scenarios:
- id: SC-001
  name: Login and view dashboard
  type: api
  description: Customer logs in, app loads profile, dashboard summary and unread badge, then logs out
  rationale: Every session starts here. bcrypt login blocks the event loop and the dashboard runs 3 parallel queries
    through a single SQLite connection
  business_criticality: 5
  frequency: 5
  technical_risk: 5
  workload_share: 30
  data_file: users.csv
  data_requirements:
  - 'pre-registered perf users (users.csv: email); password from env PERF_PASSWORD'
  risks:
  - bcrypt CPU on event loop
  - single DB connection
  status: approved
  steps:
  - name: Login
    method: POST
    path: /auth/login
    body:
      email: '{{email}}'
      password: '{{env.PERF_PASSWORD}}'
    expect:
    - 200
    think_time: 1
  - name: Get current user
    method: GET
    path: /auth/me
    expect:
    - 200
    think_time: 0
  - name: Dashboard summary
    method: GET
    path: /dashboard/summary
    expect:
    - 200
    think_time: 0
  - name: Unread count
    method: GET
    path: /inbox/unread-count
    expect:
    - 200
    think_time: 15
  - name: Dashboard refresh
    method: GET
    path: /dashboard/summary
    expect:
    - 200
    think_time: 5
  - name: Logout
    method: POST
    path: /auth/logout
    expect:
    - 204
    think_time: 1
  priority_score: 100
  priority: P1
  rank: 1
  review:
    decision: approved
    at: '2026-10-24T09:48:19+05:30'
    note: Approved by owner (own demo app); SC-009 share set to 1%, SC-002 to 29%
