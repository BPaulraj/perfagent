    decision: deferred
    at: '2026-10-24T09:11:26+05:30'
    note: low share; revisit after baseline
scoring:
  weights:
    business_criticality: 0.4
    frequency: 0.35
    technical_risk: 0.25
  bands:
    P1: '>= 75'
    P2: '>= 50'
    P3: '>= 0'
